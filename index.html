<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cozy home office corners filled with natural daylight for focused study sessions. 📖☀️</title>

<meta property="og:type" content="video.other">
<meta property="og:title" content="Cozy home office corners filled with natural daylight for focused study sessions. 📖☀️">
<meta property="og:description" content="Tonton video lengkap kualitas Full HD.">

<style>
:root{
  --bg:#07090e;
  --card:rgba(13,17,27,.9);
  --cyan:#00f0ff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:var(--bg);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px 14px;
}

.container{
  width:100%;
  max-width:480px;
}

.player-card{
  background:var(--card);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:16px;
  box-shadow:0 25px 60px rgba(0,0,0,.7);
}

.video-box{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
}

.video-box video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.play-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.25);
  pointer-events:none;
  transition:.25s;
}

.play-circle{
  width:76px;
  height:76px;
  border-radius:50%;
  background:#e00000;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 30px rgba(255,0,0,.55);
}

.play-circle svg{
  width:32px;
  height:32px;
  fill:#fff;
  margin-left:4px;
}

.video-box.playing .play-overlay{
  opacity:0;
}

.video-title{
  margin-top:16px;
  font-size:16px;
  line-height:1.4;
}

.quality{
  position:absolute;
  top:12px;
  right:12px;
  z-index:3;
  background:rgba(0,0,0,.75);
  color:var(--cyan);
  padding:5px 9px;
  border-radius:6px;
  font-size:10px;
  font-weight:bold;
}

.watch-btn{
  width:100%;
  margin-top:16px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#e00000,#a00000);
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.watch-btn:hover{
  opacity:.9;
}

.footer{
  text-align:center;
  margin-top:14px;
  color:#64748b;
  font-size:11px;
}
</style>
</head>

<body>

<div class="container">

  <div class="player-card">

    <div id="videoBox" class="video-box">

      <video
        id="videoPlayer"
        playsinline
        preload="metadata"
        poster=""
      >
        <source
          src="https://cdn2.videy.co/yAEWmuDs1.mp4"
          type="video/mp4">
      </video>

      <div class="quality">HD</div>

      <div id="playOverlay" class="play-overlay">
        <div class="play-circle">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>

    </div>

    <h1 class="video-title">
      Cozy home office corners filled with natural daylight for focused study sessions. 📖☀️
    </h1>

    <button id="watchBtn" class="watch-btn">
      ▶ Watch Online
    </button>

    <div class="footer">
      Powered by VideoPlay
    </div>

  </div>

</div>

<script>
const videoBox = document.getElementById("videoBox");
const video = document.getElementById("videoPlayer");
const watchBtn = document.getElementById("watchBtn");

function playVideo(){
  video.play()
    .then(function(){
      videoBox.classList.add("playing");
      watchBtn.textContent = "⏸ Pause Video";
    })
    .catch(function(){
      videoBox.classList.remove("playing");
    });
}

videoBox.addEventListener("click", function(){
  if(video.paused){
    playVideo();
  }else{
    video.pause();
    videoBox.classList.remove("playing");
    watchBtn.textContent = "▶ Watch Online";
  }
});

watchBtn.addEventListener("click", function(){

  if(video.paused){
    playVideo();
  }else{
    video.pause();
    videoBox.classList.remove("playing");
    watchBtn.textContent = "▶ Watch Online";
  }

});

video.addEventListener("play", function(){
  videoBox.classList.add("playing");
  watchBtn.textContent = "⏸ Pause Video";
});

video.addEventListener("pause", function(){
  videoBox.classList.remove("playing");
  watchBtn.textContent = "▶ Watch Online";
});

video.addEventListener("error", function(){
  watchBtn.textContent = "Video unavailable";
});
</script>

</body>
</html>
</script>
